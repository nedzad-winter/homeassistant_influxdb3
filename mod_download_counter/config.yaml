name: Mod Download Counter
description: Fetches download counts from Modrinth (API) and CurseForge (Playwright) and sends them to Home Assistant as sensors.
version: "1.1.3"
slug: mod_download_counter
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
homeassistant_api: true
options:
  interval_hours: 1
  mods:
    - name: "create_photomovement"
      modrinth_slug: "create-photomovement"
      curseforge_path: "minecraft/mc-mods/create-photomovement"
schema:
  interval_hours: int
  mods:
    - name: str
      modrinth_slug: str
      curseforge_path: str
